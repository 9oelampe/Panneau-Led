<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#08090C">
<title>Panneau LED</title>
<style>
:root{
  --void:#08090C;
  --panel:#16181D;
  --panel-hi:#1F232A;
  --rule:#2C313A;
  --phosphor:#FFB627;
  --signal:#FF3B30;
  --ink:#E8E6E1;
  --ink-dim:#79818F;
  --ui:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,Menlo,"SF Mono",Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--void);color:var(--ink);font-family:var(--ui);overscroll-behavior:none}
body{-webkit-text-size-adjust:100%}

/* ---------- deck (sticky live panel) ---------- */
.deck{
  position:sticky;top:0;z-index:20;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 12px;
  background:linear-gradient(180deg,var(--void) 76%,rgba(8,9,12,0));
}
.deck-legend{display:flex;align-items:baseline;gap:10px;margin-bottom:9px}
.brand{font-size:10px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-dim)}
.deck-state{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--phosphor);opacity:.85}
#preview{
  display:block;width:100%;height:128px;border-radius:9px;
  border:1px solid var(--rule);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05), 0 8px 26px rgba(0,0,0,.6);
}

/* ---------- rack sections ---------- */
main{padding:4px 14px 132px}
.rack{padding:18px 0;border-top:1px solid rgba(44,49,58,.55)}
.rack:first-child{border-top:0;padding-top:8px}
.legend{display:flex;align-items:center;gap:11px;margin:0 0 13px;font-size:10px;font-weight:700;
  letter-spacing:.2em;text-transform:uppercase;color:var(--ink-dim)}
.legend .rule{flex:1;height:1px;background:linear-gradient(90deg,var(--rule),rgba(44,49,58,0))}
.legend .val{font-family:var(--mono);font-size:10px;font-weight:400;letter-spacing:.06em;
  color:var(--phosphor);text-transform:none;white-space:nowrap}

/* ---------- message ---------- */
.msg-wrap{display:flex;gap:8px;align-items:stretch}
#msg{
  flex:1;min-width:0;background:var(--panel);border:1px solid var(--rule);border-radius:8px;
  color:var(--ink);font-family:var(--ui);font-size:17px;font-weight:600;padding:13px 14px;
  outline:none;appearance:none;
}
#msg:focus{border-color:var(--phosphor);box-shadow:0 0 0 3px rgba(255,182,39,.12)}
.case-btn{
  flex:none;width:52px;background:var(--panel);border:1px solid var(--rule);border-radius:8px;
  color:var(--ink-dim);font-family:var(--mono);font-size:13px;font-weight:600;
}
.case-btn[aria-pressed="true"]{color:var(--phosphor);border-color:rgba(255,182,39,.5);background:var(--panel-hi)}
.rail{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail button{flex:none;width:40px;height:40px;font-size:20px;line-height:1;background:var(--panel);
  border:1px solid var(--rule);border-radius:8px;padding:0}
.rail button:active{background:var(--panel-hi)}

/* ---------- chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{
  flex:none;background:var(--panel);border:1px solid var(--rule);border-radius:7px;
  color:var(--ink-dim);font-family:var(--ui);font-size:13px;font-weight:600;
  padding:9px 13px;white-space:nowrap;
}
.chip[aria-pressed="true"]{
  color:var(--void);background:var(--phosphor);border-color:var(--phosphor);
  box-shadow:0 0 16px rgba(255,182,39,.28);
}
.chip.wide{flex:1;text-align:center}

/* ---------- sliders ---------- */
.slider{display:flex;align-items:center;gap:12px;margin-top:14px}
.slider label{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);flex:none;width:62px}
input[type=range]{
  flex:1;appearance:none;height:26px;background:transparent;margin:0;
}
input[type=range]::-webkit-slider-runnable-track{height:2px;background:var(--rule);border-radius:2px}
input[type=range]::-webkit-slider-thumb{
  appearance:none;width:22px;height:22px;margin-top:-10px;border-radius:50%;
  background:var(--phosphor);border:3px solid var(--void);box-shadow:0 0 12px rgba(255,182,39,.5);
}
input[type=range]::-moz-range-track{height:2px;background:var(--rule)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--phosphor);border:3px solid var(--void)}

/* ---------- colours ---------- */
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid var(--rule);padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink);transform:scale(1.1)}
.sw-custom{position:relative;width:34px;height:34px;border-radius:50%;border:2px dashed var(--rule);overflow:hidden}
.sw-custom input{position:absolute;inset:-6px;width:150%;height:150%;border:0;padding:0;background:transparent}
.sub{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);margin:0 0 9px}
.sub.mt{margin-top:16px}

/* ---------- mémoires ---------- */
#memList{display:flex;flex-direction:column;gap:8px}
.mem{display:flex;align-items:center;gap:11px;padding:8px;background:var(--panel);
  border:1px solid var(--rule);border-radius:9px;text-align:left;width:100%}
.mem:active{background:var(--panel-hi)}
.mem-thumb{flex:none;width:96px;height:44px;border-radius:5px;border:1px solid var(--rule);display:block}
.mem-name{flex:1;min-width:0;font-size:14px;font-weight:600;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mem-del{flex:none;width:34px;height:34px;border-radius:50%;background:transparent;
  border:1px solid var(--rule);color:var(--ink-dim);font-size:17px;line-height:1;padding:0}
.mem-del[data-armed="1"]{border-color:var(--signal);color:var(--signal);background:rgba(255,59,48,.12)}
.empty{font-size:13px;line-height:1.5;color:var(--ink-dim);margin:0;padding:14px;
  border:1px dashed var(--rule);border-radius:9px}

/* ---------- footer transport ---------- */
.transport{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  padding:12px 14px calc(env(safe-area-inset-bottom) + 12px);
  background:linear-gradient(180deg,rgba(8,9,12,0),var(--void) 42%);
}
#go{
  width:100%;padding:17px;border:0;border-radius:11px;background:var(--signal);color:#fff;
  font-family:var(--ui);font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  box-shadow:0 0 30px rgba(255,59,48,.34), inset 0 1px 0 rgba(255,255,255,.24);
}
#go:active{transform:translateY(1px)}
.note{font-size:12px;line-height:1.5;color:var(--ink-dim);margin:12px 0 0}
.link-btn{margin-top:12px;width:100%;padding:12px;background:var(--panel);border:1px solid var(--rule);
  border-radius:8px;color:var(--ink);font-family:var(--ui);font-size:13px;font-weight:600}

/* ---------- show mode ---------- */
#show{position:fixed;inset:0;z-index:100;background:#000;display:none}
#show.on{display:block}
#stage{display:block;width:100%;height:100%}
#hud{
  position:absolute;left:0;right:0;bottom:0;padding:16px calc(env(safe-area-inset-right) + 16px)
    calc(env(safe-area-inset-bottom) + 16px) calc(env(safe-area-inset-left) + 16px);
  display:flex;gap:8px;justify-content:flex-end;
  background:linear-gradient(180deg,transparent,rgba(0,0,0,.72));
  opacity:0;transition:opacity .22s;pointer-events:none;
}
#hud.on{opacity:1;pointer-events:auto}
#hud button{background:rgba(22,24,29,.9);border:1px solid var(--rule);border-radius:8px;color:var(--ink);
  font-family:var(--ui);font-size:13px;font-weight:600;padding:11px 16px;backdrop-filter:blur(8px)}
#hudLabel{margin-right:auto;align-self:center;font-family:var(--mono);font-size:11px;letter-spacing:.08em;
  color:var(--phosphor);background:rgba(22,24,29,.9);border:1px solid var(--rule);border-radius:8px;
  padding:9px 12px;max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step{padding:11px 15px !important;font-size:17px !important;line-height:1}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--phosphor);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms !important}}
</style>
</head>
<body>

<div id="app">
  <header class="deck">
    <div class="deck-legend">
      <span class="brand">Panneau LED</span>
      <span class="deck-state" id="stateReadout"></span>
    </div>
    <canvas id="preview"></canvas>
  </header>

  <main>
    <section class="rack">
      <h2 class="legend"><span>Message</span><i class="rule"></i></h2>
      <div class="msg-wrap">
        <input id="msg" type="text" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Écris ton message">
        <button class="case-btn" id="caseBtn" aria-pressed="true">AA</button>
      </div>
      <div class="rail" id="emojiRail"></div>
    </section>

    <section class="rack">
      <h2 class="legend"><span>Mémoires</span><i class="rule"></i><b class="val" id="memVal"></b></h2>
      <div id="memList"></div>
      <button class="link-btn" id="memSave">Enregistrer ce panneau</button>
      <p class="note" id="memNote"></p>
    </section>

    <section class="rack">
      <h2 class="legend"><span>Préréglages</span><i class="rule"></i></h2>
      <div class="chips" id="presets"></div>
    </section>

    <section class="rack">
      <h2 class="legend"><span>Police</span><i class="rule"></i><b class="val" id="fontVal"></b></h2>
      <div class="chips scroll" id="fonts"></div>
      <div class="chips" style="margin-top:10px" id="weights"></div>
      <div class="slider"><label>Taille</label><input type="range" id="size" min="30" max="95" step="1"></div>
    </section>

    <section class="rack">
      <h2 class="legend"><span>Rendu</span><i class="rule"></i><b class="val" id="fxVal"></b></h2>
      <div class="chips" id="effects"></div>
      <p class="sub mt">Clignotement</p>
      <div class="chips" id="blinks"></div>
    </section>

    <section class="rack">
      <h2 class="legend"><span>Matrice LED</span><i class="rule"></i><b class="val" id="ledVal"></b></h2>
      <div class="chips" id="leds"></div>
      <div class="slider"><label>Finesse</label><input type="range" id="cell" min="7" max="28" step="1"></div>
      <div class="chips" style="margin-top:12px" id="grid"></div>
    </section>

    <section class="rack">
      <h2 class="legend"><span>Couleurs</span><i class="rule"></i></h2>
      <p class="sub">Texte</p>
      <div class="swatches" id="fg"></div>
      <p class="sub mt">Fond</p>
      <div class="swatches" id="bg"></div>
    </section>

    <section class="rack">
      <h2 class="legend"><span>Mouvement</span><i class="rule"></i><b class="val" id="moveVal"></b></h2>
      <div class="chips" id="dirs"></div>
      <div class="slider"><label>Vitesse</label><input type="range" id="speed" min="1" max="20" step="1"></div>
    </section>

    <section class="rack">
      <h2 class="legend"><span>Écran</span><i class="rule"></i></h2>
      <div class="chips" id="rotates"></div>
      <button class="link-btn" id="saveLink">Mémoriser ce réglage dans le lien</button>
      <p class="note" id="saveNote">Le lien contient tous les réglages. Ajoute-le à l’écran d’accueil pour retrouver ce panneau en un geste.</p>
    </section>
  </main>

  <div class="transport"><button id="go">Afficher</button></div>
</div>

<div id="show">
  <canvas id="stage"></canvas>
  <div id="hud">
    <span id="hudLabel"></span>
    <button id="hudPrev" class="step" aria-label="Panneau précédent">‹</button>
    <button id="hudNext" class="step" aria-label="Panneau suivant">›</button>
    <button id="hudRotate">Pivoter</button>
    <button id="hudQuit">Quitter</button>
  </div>
</div>

<script>
"use strict";

/* ============ données ============ */
const FONTS = [
  ["Système",'-apple-system,system-ui,"Segoe UI",Roboto,sans-serif'],
  ["Helvetica",'"Helvetica Neue",Helvetica,Arial,sans-serif'],
  ["Avenir",'"Avenir Next",Avenir,"Segoe UI",sans-serif'],
  ["Futura",'Futura,"Trebuchet MS",sans-serif'],
  ["Gill Sans",'"Gill Sans","Gill Sans MT",Calibri,sans-serif'],
  ["Didot",'Didot,"Bodoni 72",Georgia,serif'],
  ["Georgia",'Georgia,"Times New Roman",serif'],
  ["Machine",'Menlo,Consolas,"Courier New",monospace'],
  ["Marqueur",'"Marker Felt","Bradley Hand","Comic Sans MS",cursive'],
  ["Craie",'"Chalkboard SE",Chalkduster,"Comic Sans MS",cursive'],
  ["Anglaise",'"Snell Roundhand","Savoye LET","Apple Chancery",cursive'],
  ["Copperplate",'Copperplate,"Copperplate Gothic Light",Papyrus,fantasy']
];
const WEIGHTS = [["Normal",400],["Gras",700],["Noir",900]];
const EFFECTS = [["plein","Plein"],["neon","Néon"],["contour","Contour"],["ombre","Ombre dure"],
                 ["degrade","Dégradé"],["arc","Arc-en-ciel"],["chrome","Chrome"],["feu","Feu"]];
const BLINKS  = [["off","Aucun"],["clignote","Clignote"],["pulse","Pulsation"],["strobe","Strobo"]];
const LEDS    = [["off","Aucune"],["circle","Rond"],["square","Carré"],["heart","Cœur"],["star","Étoile"]];
const DIRS    = [["left","← Gauche"],["right","Droite →"],["fixe","Fixe"]];
const ROTS    = [["auto","Auto"],["force","Paysage forcé"]];
const FG = ["#FFB627","#FFFFFF","#FF2D55","#35FF6B","#31C7FF","#B14BFF","#FF6A00"];
const BG = ["#000000","#0B1020","#1A0016","#FFFFFF"];
const EMOJI = ["🔥","❤️","🎉","⚡️","🙌","👀","😂","😎","💀","🎸","🎧","🥁","🍺","🏆","⭐️","👋","🚨","✅","❌","🇫🇷","🇬🇧","🐣","💃","🎂"];

const PRESETS = {
  "Concert": {effect:"neon",led:"off",fg:"#FF2D55",bg:"#000000",size:78,dir:"left",speed:7,blink:"off",font:2,weight:900,cell:12,grid:true},
  "Aéroport":{effect:"plein",led:"circle",fg:"#FFB627",bg:"#000000",size:58,dir:"fixe",speed:5,blink:"off",font:1,weight:700,cell:11,grid:true},
  "Rave":    {effect:"arc",led:"square",fg:"#B14BFF",bg:"#000000",size:82,dir:"left",speed:14,blink:"pulse",font:3,weight:900,cell:10,grid:false},
  "Rétro":   {effect:"plein",led:"circle",fg:"#35FF6B",bg:"#000000",size:62,dir:"left",speed:6,blink:"off",font:7,weight:700,cell:14,grid:true}
};

/* ============ état ============ */
const S = {
  text:"Salut Newcastle 👋", upper:true,
  font:2, weight:900, size:74,
  effect:"neon", blink:"off",
  led:"off", cell:12, grid:true,
  fg:"#FFB627", bg:"#000000",
  dir:"left", speed:7, rotate:"auto"
};
const clone = o => JSON.parse(JSON.stringify(o));

/* ============ couleurs ============ */
const rgb = h => {h=String(h).replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];};
const hex = a => '#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const mix = (a,b,t) => hex(rgb(a).map((v,i)=>v+(rgb(b)[i]-v)*t));
const lum = c => {const [r,g,b]=rgb(c);return (0.299*r+0.587*g+0.114*b)/255;};

/* ============ formes de LED ============ */
function pathDot(c,shape,x,y,r){
  if(shape==="square"){const s=r*0.92;c.beginPath();c.rect(x-s,y-s,s*2,s*2);return;}
  if(shape==="star"){
    c.beginPath();
    for(let i=0;i<10;i++){
      const rr=i%2?r*0.46:r*1.15, a=-Math.PI/2+i*Math.PI/5;
      const px=x+Math.cos(a)*rr, py=y+Math.sin(a)*rr;
      i?c.lineTo(px,py):c.moveTo(px,py);
    }
    c.closePath();return;
  }
  if(shape==="heart"){
    const s=r/15;c.beginPath();
    c.moveTo(x,y+5*s);
    c.bezierCurveTo(x,y+1*s,x-4*s,y-9*s,x-10*s,y-9*s);
    c.bezierCurveTo(x-17*s,y-9*s,x-17*s,y+2*s,x-17*s,y+2*s);
    c.bezierCurveTo(x-17*s,y+8*s,x-11*s,y+13*s,x,y+19*s);
    c.bezierCurveTo(x+11*s,y+13*s,x+17*s,y+8*s,x+17*s,y+2*s);
    c.bezierCurveTo(x+17*s,y+2*s,x+17*s,y-9*s,x+10*s,y-9*s);
    c.bezierCurveTo(x+4*s,y-9*s,x,y+1*s,x,y+5*s);
    c.closePath();return;
  }
  c.beginPath();c.arc(x,y,r,0,6.2832);
}

/* ============ tuile de texte (mise en cache) ============ */
const MAX_TILE   = 3800;          // marge sous la limite de 4096 px par côté d'iOS Safari
const tileCache  = new Map();
const stripCache = new Map();
const fitCache   = new Map();
let tilePixels = 0;
function clearTiles(){ tileCache.clear(); stripCache.clear(); fitCache.clear(); tilePixels = 0; }
function tileKey(px,st,wrapW,txt){return [txt!=null?txt:st.text,st.upper,st.font,st.weight,st.effect,st.fg,Math.round(px),wrapW?Math.round(wrapW):0].join("|");}

/* Découpe le message en lignes tenant dans wrapW. wrapW nul = une seule ligne. */
function wrapText(wOf, txt, wrapW){
  if(!wrapW || wOf(txt) <= wrapW) return [txt];
  const words = txt.split(/\s+/).filter(Boolean);
  if(words.length < 2) return [txt];
  const lines = []; let cur = words[0];
  for(let i=1;i<words.length;i++){
    const test = cur + " " + words[i];
    if(wOf(test) <= wrapW) cur = test;
    else { lines.push(cur); cur = words[i]; }
  }
  lines.push(cur);
  return lines;
}

/* Plus grande police à laquelle le message entier tient dans la boîte,
   réparti sur autant de lignes que nécessaire. Recherche par dichotomie,
   sur simple mesure : aucun rendu, donc mise en cache et coût négligeable. */
function fitPx(st, boxW, boxH){
  const key = [st.text,st.upper,st.font,st.weight,Math.round(boxW),Math.round(boxH)].join("|");
  if(fitCache.has(key)) return fitCache.get(key);

  const txt = (st.upper ? String(st.text).toUpperCase() : String(st.text)) || " ";
  const fam = (FONTS[st.font]||FONTS[0])[1];
  const probe = document.createElement("canvas").getContext("2d");

  const fits = px => {
    probe.font = `${st.weight} ${px}px ${fam}`;
    const wOf = s => probe.measureText(s).width;
    const pad = px*0.30, wrapW = boxW - pad*2;
    if(wrapW <= px*0.4) return false;
    const lines = wrapText(wOf, txt, wrapW);
    if(Math.max(...lines.map(wOf)) > wrapW) return false;   // un mot seul trop long
    const m = probe.measureText(txt);
    const asc  = m.actualBoundingBoxAscent  || px*0.80;
    const desc = m.actualBoundingBoxDescent || px*0.26;
    return (asc+desc)*1.16*(lines.length-1) + asc + desc + pad*2 <= boxH;
  };

  let lo = 6, hi = Math.max(10, boxH*1.3);
  if(fits(hi)) lo = hi;
  else for(let i=0;i<20;i++){ const mid=(lo+hi)/2; if(fits(mid)) lo = mid; else hi = mid; }

  if(fitCache.size > 24) fitCache.clear();
  fitCache.set(key, lo);
  return lo;
}

function buildTile(px,st,wrapW,textOverride){
  const key = tileKey(px,st,wrapW,textOverride);
  if(tileCache.has(key)) return tileCache.get(key);

  const base = textOverride != null ? textOverride : String(st.text);
  const txt = (st.upper ? base.toUpperCase() : base) || " ";
  const fam = (FONTS[st.font]||FONTS[0])[1];
  const probe = document.createElement("canvas").getContext("2d");
  probe.font = `${st.weight} ${px}px ${fam}`;
  const wOf = s => probe.measureText(s).width;

  const lines = wrapText(wOf, txt, wrapW);
  const m = probe.measureText(txt);
  const asc   = m.actualBoundingBoxAscent  || px*0.80;
  const desc  = m.actualBoundingBoxDescent || px*0.26;
  const lineH = (asc + desc) * 1.16;
  const pad   = px*0.30;
  const textW  = Math.max(1, ...lines.map(wOf));
  const blockH = lineH*(lines.length-1) + asc + desc;
  const w = Math.min(MAX_TILE, Math.max(2, Math.ceil(textW + pad*2)));
  const h = Math.min(MAX_TILE, Math.max(2, Math.ceil(blockH + pad*2)));

  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  const c = cv.getContext("2d");
  c.font = `${st.weight} ${px}px ${fam}`;
  c.textBaseline = "alphabetic";
  const X = pad, Y = pad + asc;
  const top = pad, bot = pad + blockH;

  const fillAll   = (dx,dy)=> lines.forEach((ln,i)=> c.fillText(ln,   X + (textW - wOf(ln))/2 + (dx||0), Y + i*lineH + (dy||0)));
  const strokeAll = ()=>      lines.forEach((ln,i)=> c.strokeText(ln, X + (textW - wOf(ln))/2,           Y + i*lineH));

  const grad = (stops,horiz) => {
    const g = horiz ? c.createLinearGradient(X,0,X+textW,0) : c.createLinearGradient(0,top,0,bot);
    stops.forEach((s,i)=>g.addColorStop(i/(stops.length-1),s));
    return g;
  };

  switch(st.effect){
    case "neon":
      c.shadowColor = st.fg;
      [px*0.42,px*0.24,px*0.11].forEach(b=>{ c.shadowBlur=b; c.fillStyle=st.fg; fillAll(); });
      c.shadowBlur = px*0.06;
      c.fillStyle = mix(st.fg,"#ffffff",0.62);
      fillAll();
      break;
    case "contour":
      c.lineWidth = Math.max(1.5, px*0.055);
      c.lineJoin = "round"; c.strokeStyle = st.fg;
      strokeAll();
      break;
    case "ombre":
      c.fillStyle = mix(st.fg,"#000000",0.62);
      fillAll(px*0.055, px*0.055);
      c.fillStyle = st.fg; fillAll();
      break;
    case "degrade":
      c.fillStyle = grad([mix(st.fg,"#ffffff",0.55), st.fg, mix(st.fg,"#000000",0.42)],false);
      fillAll(); break;
    case "arc":
      c.fillStyle = grad(["#FF2D55","#FF9500","#FFE600","#35FF6B","#31C7FF","#5E5CE6","#FF2D55"],true);
      fillAll(); break;
    case "chrome":
      c.fillStyle = grad(["#ffffff","#dfe7f0","#8d99ab","#f4f8fc","#59616f","#c6d1dd"],false);
      fillAll(); break;
    case "feu":
      c.fillStyle = grad(["#fff9d6","#ffd227","#ff8a00","#e02200"],false);
      fillAll(); break;
    default:
      c.fillStyle = st.fg; fillAll();
  }

  if(tilePixels > 24e6) clearTiles();
  tilePixels += w*h;
  tileCache.set(key,cv);
  return cv;
}

/* Un message long dépasse largement la largeur maximale d'un canvas iOS.
   On le découpe donc en tronçons aux espaces, chacun sous la limite, que
   l'on raboute à l'affichage : le ruban peut alors être infiniment long. */
function buildStrip(px,st){
  const key = tileKey(px,st,0,null);
  if(stripCache.has(key)) return stripCache.get(key);

  const txt = (st.upper ? String(st.text).toUpperCase() : String(st.text)) || " ";
  const fam = (FONTS[st.font]||FONTS[0])[1];
  const probe = document.createElement("canvas").getContext("2d");
  probe.font = `${st.weight} ${px}px ${fam}`;
  const wOf = s => probe.measureText(s).width;
  const pad = px*0.30;
  const budget = Math.max(px*2, MAX_TILE - pad*2);

  let chunks = [txt];
  if(wOf(txt) > budget){
    chunks = [];
    let cur = "";
    for(const word of txt.split(" ")){
      const test = cur === "" ? word : cur + " " + word;
      if(cur === "" || wOf(test) <= budget) cur = test;
      else { chunks.push(cur + " "); cur = word; }
    }
    if(cur !== "") chunks.push(cur);
  }

  const tiles = chunks.map(ch => buildTile(px, st, 0, ch));
  const adv   = chunks.map(ch => wOf(ch));
  const strip = {
    tiles, adv,
    width : adv.reduce((a,b)=>a+b,0) + pad*2,
    height: tiles[0].height
  };
  if(stripCache.size > 8) stripCache.clear();
  stripCache.set(key, strip);
  return strip;
}

/* ============ modulation temporelle ============ */
function alphaAt(t,st){
  let a = 1;
  if(st.blink==="clignote") a = (Math.floor(t*2)%2) ? 0.04 : 1;
  else if(st.blink==="pulse") a = 0.42 + 0.58*(0.5+0.5*Math.sin(t*3.4));
  else if(st.blink==="strobe") a = (Math.floor(t*11)%2) ? 0 : 1;
  if(st.effect==="feu") a *= 0.86 + 0.14*(0.5+0.5*Math.sin(t*17.3)+0.35*Math.sin(t*41.7))/1.35;
  return Math.max(0,Math.min(1,a));
}

/* ============ composition du défilement ============ */
function paintScroll(c,W,H,t,px,st){
  if(st.dir==="fixe"){
    // On part de la plus grande police qui tienne, puis le curseur Taille
    // agit comme un taux de remplissage de l'écran (30 % → 100 %).
    const boxW = W*0.94, boxH = H*0.94;
    const p = Math.max(8, fitPx(st,boxW,boxH) * (st.size/95));
    const tile = buildTile(p, st, boxW - p*0.6);
    const k = Math.min(1, boxW/tile.width, boxH/tile.height);
    c.drawImage(tile, (W-tile.width*k)/2, (H-tile.height*k)/2, tile.width*k, tile.height*k);
    return;
  }
  const strip = buildStrip(px,st);
  const y = (H - strip.height)/2;
  const gap = H*0.55;
  const span = strip.width + gap;
  const v = st.speed * W * 0.055;
  let off = (t*v) % span;
  if(st.dir==="right") off = span - off;
  let x = -off, guard = 0;
  while(x < W && guard++ < 200){
    let cx = x;
    for(let i=0;i<strip.tiles.length;i++){
      const tl = strip.tiles[i];
      if(cx < W && cx + tl.width > 0) c.drawImage(tl, cx, y);
      cx += strip.adv[i];
    }
    x += span;
  }
}

/* ============ grille éteinte (statique, donc pré-calculée) ============ */
const gridCache = new Map();
function gridBitmap(W,H,cell,cols,rows,ox,oy,r,st){
  const key = [Math.round(W),Math.round(H),st.led,cell.toFixed(2),st.bg].join("|");
  if(gridCache.has(key)) return gridCache.get(key);
  const gm = document.createElement("canvas");
  gm.width = Math.max(1,Math.ceil(W*2)); gm.height = Math.max(1,Math.ceil(H*2));
  const mc = gm.getContext("2d");
  mc.setTransform(2,0,0,2,0,0);
  mc.fillStyle = lum(st.bg) > 0.5 ? "rgba(0,0,0,.075)" : "rgba(255,255,255,.055)";
  for(let j=0;j<rows;j++) for(let i=0;i<cols;i++){
    pathDot(mc,st.led, ox+i*cell, oy+j*cell, r); mc.fill();
  }
  if(gridCache.size > 6) gridCache.clear();
  gridCache.set(key,gm);
  return gm;
}

/* ============ rendu d'une image ============
   La transformation courante (échelle écran, rotation éventuelle) est posée
   par l'appelant : on dessine ici en coordonnées logiques 0..W / 0..H. */
function render(c,W,H,t,st){
  st = st || S;
  c.fillStyle = st.bg;
  c.fillRect(0,0,W,H);

  const px = Math.max(8, H * (st.size/100) * 0.62);
  const a = alphaAt(t,st);

  if(st.led==="off"){
    c.save(); c.globalAlpha = a;
    paintScroll(c,W,H,t,px,st);
    c.restore();
    return;
  }
  drawMatrix(c,W,H,t,px,a,st);
}

function drawMatrix(c,W,H,t,px,a,st){
  let cell = Math.max(5, st.cell * (H/300));
  while((W/cell)*(H/cell) > 5200) cell *= 1.12;   // plafond de LED pour tenir 60 fps
  const cols = Math.max(1, Math.floor(W/cell));
  const rows = Math.max(1, Math.floor(H/cell));

  const g = drawMatrix.buf || (drawMatrix.buf = document.createElement("canvas"));
  if(g.width !== cols || g.height !== rows){ g.width = cols; g.height = rows; }
  const gc = g.getContext("2d",{willReadFrequently:true});
  gc.setTransform(1,0,0,1,0,0);
  gc.clearRect(0,0,cols,rows);
  gc.imageSmoothingEnabled = true;
  gc.imageSmoothingQuality = "high";
  gc.setTransform(1/cell,0,0,1/cell,0,0);
  paintScroll(gc,cols*cell,rows*cell,t,px,st);
  gc.setTransform(1,0,0,1,0,0);

  const data = gc.getImageData(0,0,cols,rows).data;
  const ox = (W - cols*cell)/2 + cell/2;
  const oy = (H - rows*cell)/2 + cell/2;
  const r  = cell*0.42;

  if(st.grid){
    c.globalAlpha = 1;
    c.drawImage(gridBitmap(W,H,cell,cols,rows,ox,oy,r,st), 0, 0, W, H);
  }

  for(let j=0;j<rows;j++){
    for(let i=0;i<cols;i++){
      const k = (j*cols+i)*4;
      const al = data[k+3]/255;
      if(al < 0.07) continue;
      c.globalAlpha = Math.min(1, al*1.2) * a;
      c.fillStyle = `rgb(${data[k]},${data[k+1]},${data[k+2]})`;
      pathDot(c,st.led, ox+i*cell, oy+j*cell, r);
      c.fill();
    }
  }
  c.globalAlpha = 1;
}

/* ============ stockage des mémoires ============
   Trois niveaux, du plus durable au plus volatil. Sur ton téléphone c'est
   localStorage : les mémoires survivent à la fermeture de l'app. */
const MEM_KEY = "panneau-led:memoires";
const hasCloud = !!(typeof window !== "undefined" && window.storage && window.storage.get && window.storage.set);
let hasLocal = false;
try{ localStorage.setItem("__pl_test","1"); localStorage.removeItem("__pl_test"); hasLocal = true; }
catch(e){ hasLocal = false; }
let memVolatile = [];
const storeMode = () => hasCloud ? "cloud" : (hasLocal ? "local" : "session");

async function memRead(){
  if(hasCloud){
    try{ const r = await window.storage.get(MEM_KEY); return r && r.value ? JSON.parse(r.value) : []; }
    catch(e){ return []; }
  }
  if(hasLocal){
    try{ const v = localStorage.getItem(MEM_KEY); return v ? JSON.parse(v) : []; }catch(e){ return []; }
  }
  return memVolatile.slice();
}
async function memWrite(list){
  const s = JSON.stringify(list);
  if(hasCloud){ try{ await window.storage.set(MEM_KEY, s); return true; }catch(e){} }
  if(hasLocal){ try{ localStorage.setItem(MEM_KEY, s); return true; }catch(e){} }
  memVolatile = list.slice();
  return false;
}

/* ============ boucle ============ */
const preview = document.getElementById("preview");
const stage   = document.getElementById("stage");
const pctx = preview.getContext("2d");
const sctx = stage.getContext("2d");
const showEl = document.getElementById("show");
let showing = false, turned = false;

function fit(cv){
  const d = Math.min(2, window.devicePixelRatio||1);
  const w = cv.clientWidth, h = cv.clientHeight;
  if(cv.width !== Math.round(w*d) || cv.height !== Math.round(h*d)){
    cv.width = Math.round(w*d); cv.height = Math.round(h*d);
  }
  return [w,h,d];
}

let frameFails = 0;
function frame(ms){
  const t = ms/1000;
  try{
    const [pw,ph,pd] = fit(preview);
    pctx.setTransform(pd,0,0,pd,0,0);
    render(pctx,pw,ph,t,S);

    if(showing){
      const [sw,sh,sd] = fit(stage);
      turned = (S.rotate==="force" && sh > sw);
      sctx.setTransform(1,0,0,1,0,0);
      sctx.clearRect(0,0,stage.width,stage.height);
      sctx.save();
      sctx.scale(sd,sd);
      if(turned){ sctx.translate(sw,0); sctx.rotate(Math.PI/2); }
      render(sctx, turned?sh:sw, turned?sw:sh, t, showState());
      sctx.restore();
    }
    frameFails = 0;
  }catch(err){
    // un canvas refusé par le système ne doit jamais figer le panneau
    if(++frameFails === 1){ clearTiles(); console.warn("Image ignorée :", err); }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ============ interface ============ */
const $ = s => document.querySelector(s);
function chips(host, items, get, set, cls){
  host.innerHTML = "";
  items.forEach(([val,label])=>{
    const b = document.createElement("button");
    b.className = "chip" + (cls?" "+cls:"");
    b.textContent = label;
    b.dataset.v = String(val);
    b.onclick = ()=>{ set(val); sync(); };
    host.appendChild(b);
  });
  host._get = get;
}
function paintChips(host){
  if(!host._get) return;
  const cur = String(host._get());
  [...host.children].forEach(b=>b.setAttribute("aria-pressed", b.dataset.v===cur ? "true":"false"));
}

chips($("#presets"), Object.keys(PRESETS).map(k=>[k,k]), ()=>null, k=>Object.assign(S,PRESETS[k]), "wide");
chips($("#fonts"), FONTS.map((f,i)=>[i,f[0]]), ()=>S.font, v=>S.font=+v);
chips($("#weights"), WEIGHTS, ()=>S.weight, v=>S.weight=+v, "wide");
chips($("#effects"), EFFECTS, ()=>S.effect, v=>S.effect=v);
chips($("#blinks"), BLINKS, ()=>S.blink, v=>S.blink=v);
chips($("#leds"), LEDS, ()=>S.led, v=>S.led=v);
chips($("#grid"), [[true,"Grille éteinte visible"],[false,"Fond nu"]], ()=>S.grid, v=>S.grid=(v===true||v==="true"), "wide");
chips($("#dirs"), DIRS, ()=>S.dir, v=>S.dir=v, "wide");
chips($("#rotates"), ROTS, ()=>S.rotate, v=>S.rotate=v, "wide");

function swatches(host, list, get, set){
  host.innerHTML = "";
  list.forEach(col=>{
    const b = document.createElement("button");
    b.className="sw"; b.style.background=col; b.dataset.v=col;
    b.onclick=()=>{ set(col); sync(); };
    host.appendChild(b);
  });
  const wrap = document.createElement("div");
  wrap.className="sw-custom";
  const inp = document.createElement("input");
  inp.type="color"; inp.value=get();
  inp.oninput=()=>{ set(inp.value); sync(); };
  wrap.appendChild(inp); host.appendChild(wrap);
  host._get = get; host._picker = inp;
}
swatches($("#fg"), FG, ()=>S.fg, v=>S.fg=v);
swatches($("#bg"), BG, ()=>S.bg, v=>S.bg=v);

const rail = $("#emojiRail");
EMOJI.forEach(e=>{
  const b=document.createElement("button");
  b.textContent=e; b.onclick=()=>{ S.text += e; $("#msg").value = S.text; sync(); };
  rail.appendChild(b);
});

$("#msg").addEventListener("input", e=>{ S.text = e.target.value; sync(); });
$("#caseBtn").onclick = ()=>{ S.upper = !S.upper; sync(); };
$("#size").addEventListener("input", e=>{ S.size = +e.target.value; sync(); });
$("#cell").addEventListener("input", e=>{ S.cell = +e.target.value; sync(); });
$("#speed").addEventListener("input", e=>{ S.speed = +e.target.value; sync(); });

function sync(){
  clearTiles();
  if($("#msg").value !== S.text) $("#msg").value = S.text;
  // ne jamais réécrire un curseur pendant qu'un doigt le tient : iOS interrompt le glissé
  const setRange = (sel,v)=>{ const el=$(sel); if(+el.value !== v) el.value = v; };
  setRange("#size",  S.size);
  setRange("#cell",  S.cell);
  setRange("#speed", S.speed);
  $("#caseBtn").setAttribute("aria-pressed", S.upper ? "true":"false");
  $("#caseBtn").textContent = S.upper ? "AA" : "aa";
  ["#fonts","#weights","#effects","#blinks","#leds","#grid","#dirs","#rotates"].forEach(s=>paintChips($(s)));
  [["#fg",S.fg],["#bg",S.bg]].forEach(([sel,cur])=>{
    const host = $(sel);
    [...host.children].forEach(b=>{ if(b.dataset.v) b.setAttribute("aria-pressed", b.dataset.v.toLowerCase()===cur.toLowerCase()?"true":"false"); });
    if(host._picker && host._picker.value.toLowerCase() !== cur.toLowerCase()) host._picker.value = cur;
  });
  $("#fontVal").textContent = (FONTS[S.font]||FONTS[0])[0].toUpperCase();
  $("#fxVal").textContent   = (EFFECTS.find(e=>e[0]===S.effect)||["",""])[1].toUpperCase();
  $("#ledVal").textContent  = (LEDS.find(e=>e[0]===S.led)||["",""])[1].toUpperCase();
  $("#moveVal").textContent = S.dir==="fixe" ? "FIXE" : `${S.dir==="left"?"←":"→"} ${S.speed}`;
  $("#stateReadout").textContent = `${S.led==="off"?"LISSE":"MATRICE"} · ${S.dir==="fixe"?"FIXE":"DÉFILE"}`;
  writeHash();
}

/* ============ mémoires ============ */
const MAX_MEM = 24;
let mems = [];

function memName(st){
  const raw = (st.upper ? String(st.text).toUpperCase() : String(st.text)).trim();
  return (raw || "Sans titre").slice(0,26);
}
function drawThumb(cv, st){
  const d = Math.min(2, window.devicePixelRatio||1);
  const w = cv.clientWidth || 96, h = cv.clientHeight || 44;
  cv.width = Math.round(w*d); cv.height = Math.round(h*d);
  const c = cv.getContext("2d");
  c.setTransform(d,0,0,d,0,0);
  render(c, w, h, 0, Object.assign(clone(st), {dir:"fixe", blink:"off"}));
}

function paintMem(){
  const host = $("#memList");
  host.innerHTML = "";
  const mode = storeMode();

  $("#memVal").textContent = `${mems.length}/${MAX_MEM} · ` +
    (mode==="session" ? "SESSION" : mode==="local" ? "APPAREIL" : "ENREGISTRÉ");
  $("#memNote").textContent = mode==="session"
    ? "Cet aperçu bloque le stockage : les mémoires partiront en fermant l’onglet. Ouvert dans Safari sur ton téléphone, elles restent."
    : "Les mémoires survivent à la fermeture. Pendant l’affichage, balaye vers la gauche ou la droite pour passer de l’une à l’autre.";

  if(!mems.length){
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "Rien en mémoire pour l’instant. Compose un panneau, enregistre-le, et il t’attendra ici — prêt à dégainer sans retaper une lettre.";
    host.appendChild(p);
    return;
  }

  mems.forEach(m=>{
    const row = document.createElement("div");
    row.className = "mem";

    const cv = document.createElement("canvas");
    cv.className = "mem-thumb";

    const name = document.createElement("span");
    name.className = "mem-name";
    name.textContent = m.name;

    const del = document.createElement("button");
    del.className = "mem-del";
    del.textContent = "×";
    del.setAttribute("aria-label", "Supprimer " + m.name);
    del.onclick = async ev => {
      ev.stopPropagation();
      if(del.dataset.armed !== "1"){
        del.dataset.armed = "1";
        del.textContent = "?";
        setTimeout(()=>{ del.dataset.armed=""; del.textContent="×"; }, 3000);
        return;
      }
      mems = mems.filter(x=>x.id !== m.id);
      await memWrite(mems);
      paintMem();
    };

    row.onclick = ()=>{ Object.assign(S, clone(m.st)); sync(); };
    row.appendChild(cv); row.appendChild(name); row.appendChild(del);
    host.appendChild(row);
    requestAnimationFrame(()=>drawThumb(cv, m.st));
  });
}

$("#memSave").onclick = async ()=>{
  const entry = {id: Date.now() + Math.random().toString(36).slice(2,7), name: memName(S), st: clone(S)};
  mems.unshift(entry);
  if(mems.length > MAX_MEM) mems.length = MAX_MEM;
  await memWrite(mems);
  paintMem();
};

async function refreshMem(){
  try{ mems = await memRead(); }catch(e){ mems = []; }
  if(!Array.isArray(mems)) mems = [];
  paintMem();
}

/* ============ lien mémoire ============ */
function b64e(s){const b=new TextEncoder().encode(s);let o="";b.forEach(c=>o+=String.fromCharCode(c));return btoa(o).replace(/=+$/,"");}
function b64d(s){const bin=atob(s);return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)));}
let hashOk = true, hashTimer = null;
function writeHashNow(){
  if(!hashOk) return;
  try{ history.replaceState(null,"","#"+b64e(JSON.stringify(S))); }
  catch(e){ hashOk = false; }
}
function writeHash(){                    // les curseurs déclenchent sync() à 60 Hz
  clearTimeout(hashTimer);
  hashTimer = setTimeout(writeHashNow, 450);
}
function readHash(){
  try{
    const h = location.hash.slice(1);
    if(h) Object.assign(S, JSON.parse(b64d(h)));
  }catch(e){}
}
$("#saveLink").onclick = ()=>{
  writeHashNow();
  $("#saveNote").textContent = hashOk
    ? "Réglage enregistré dans l’adresse. Mets la page en favori ou sur l’écran d’accueil : elle rouvrira exactement comme ça."
    : "L’adresse est verrouillée dans cet aperçu. Ouvre le fichier directement dans Safari et le bouton fonctionnera.";
};

/* ============ mode scène + carrousel ============ */
let showList = [], showIdx = 0;
function showState(){
  const item = showList[showIdx];
  return item ? item.st : S;
}
function paintHud(){
  const many = showList.length > 1;
  $("#hudPrev").style.display = many ? "" : "none";
  $("#hudNext").style.display = many ? "" : "none";
  $("#hudLabel").textContent = many
    ? `${showIdx+1}/${showList.length} · ${showList[showIdx].name.toUpperCase()}`
    : "";
}
function step(d){
  if(showList.length < 2) return;
  showIdx = (showIdx + d + showList.length) % showList.length;
  paintHud(); flashHud();
}

let wake = null;
async function keepAwake(on){
  try{
    if(on && "wakeLock" in navigator) wake = await navigator.wakeLock.request("screen");
    else if(wake){ await wake.release(); wake = null; }
  }catch(e){}
}
let hudTimer = null;
function flashHud(){
  const h = $("#hud");
  h.classList.add("on");
  clearTimeout(hudTimer);
  hudTimer = setTimeout(()=>h.classList.remove("on"), 2800);
}

$("#go").onclick = ()=>{
  showList = [{name:"En cours", st:clone(S)}].concat(mems.map(m=>({name:m.name, st:clone(m.st)})));
  showIdx = 0;
  showing = true; showEl.classList.add("on");
  keepAwake(true); paintHud(); flashHud();
};
$("#hudQuit").onclick   = e=>{ e.stopPropagation(); showing=false; showEl.classList.remove("on"); keepAwake(false); };
$("#hudRotate").onclick = e=>{ e.stopPropagation(); S.rotate = S.rotate==="force"?"auto":"force"; sync(); flashHud(); };
$("#hudPrev").onclick   = e=>{ e.stopPropagation(); step(-1); };
$("#hudNext").onclick   = e=>{ e.stopPropagation(); step(1); };

let tx=0, ty=0;
showEl.addEventListener("touchstart", e=>{ tx=e.touches[0].clientX; ty=e.touches[0].clientY; }, {passive:true});
showEl.addEventListener("touchend", e=>{
  const p = e.changedTouches[0];
  const dxRaw = p.clientX - tx, dyRaw = p.clientY - ty;
  // en paysage forcé, l'axe du panneau est tourné de 90° par rapport au doigt
  const along  = turned ? dyRaw : dxRaw;
  const across = turned ? dxRaw : dyRaw;
  if(Math.abs(along) > 60 && Math.abs(along) > Math.abs(across)) step(along < 0 ? 1 : -1);
  else if(Math.abs(dxRaw) < 14 && Math.abs(dyRaw) < 14) flashHud();
}, {passive:true});
showEl.addEventListener("click", flashHud);
window.addEventListener("keydown", e=>{
  if(!showing) return;
  if(e.key==="ArrowRight") step(1);
  else if(e.key==="ArrowLeft") step(-1);
  else if(e.key==="Escape"){ showing=false; showEl.classList.remove("on"); keepAwake(false); }
});
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && showing) keepAwake(true); });

/* ============ démarrage ============ */
readHash();
sync();
refreshMem();

</script>
</body>
